<table class="table table-dark text-center align-middle">
  <tbody>

    @if (productos.length > 0) {

      @for (p of productos; track p.id) {

        <tr>

          <!-- Imagen -->
          <th scope="row">
            <img [src]="p.imagen" [alt]="p.nombre" width="50">
          </th>

          <!-- Nombre -->
          <td>{{ p.nombre }}</td>

          <!-- Cantidad -->
          <td>{{ p.cantidad }}</td>

          <!-- Botón + -->
          <td>
            <button
              class="btn btn-dark btn-sm"
              (click)="aumentar (p.id)">
              +
            </button>
          </td>

          <!-- Botón - -->
          <td>
            <button
              class="btn btn-dark btn-sm"
              (click)="disminuir(p.id)">
              -
            </button>
          </td>


          <!-- Precio -->
          <td>${{ p.precio * p.cantidad }}</td>

          <!-- Basura -->
          <td class="table-active">
            <button
              class="btn btn-danger btn-sm"
              (click)="eliminar(p.id)">
              <i class="bi bi-trash-fill"></i>
            </button>
          </td>

        </tr>
       
      }
 <tr>
        <td colspan="7" class="text-end pe-4 py-3">
          <button class="btn btn-success btn-lg" (click)="realizarCompra()">
            Comprar Carrito
          </button>
        </td>
      </tr>
    } @else {

      <tr>
        <td colspan="7">El carrito está vacío</td>
      </tr>

    }

  </tbody>
</table>
