<div class="container py-4">

  <div class="text-center mb-5">
    <h1 class="display-4 fw-bold neon-title">
      🛒 Productos
    </h1>

    <p class="text-secondary fs-5">
      Elegí tus productos favoritos
    </p>
  </div>

  <div class="row justify-content-center g-4">

    @for (p of PRODUCTOS; track p.id) {
    @if (p.disponibilidad) {

      <div class="col-12 col-md-6 col-lg-4 d-flex justify-content-center">

        <div class="card product-card h-100">

          <img
            src="{{ p.imagen }}"
            class="card-img-top product-img"
            alt="{{ p.nombre }}"
          >

          <div class="card-body d-flex flex-column">

            <h5 class="card-title fw-bold text-light">
              {{ p.nombre }}
            </h5>

            <p class="text-secondary small">
              {{ p.descripcion }}
            </p>

            <p class="fw-bold text-success fs-5">
              ${{ p.precio }}
            </p>

            <!-- BOTONES -->
            <div class="mt-auto d-flex flex-column gap-2">

              <button
                (click)="agregarAlCarrito(p)"
                class="btn btn-neon w-100 fw-bold">
                🛒 Comprar
              </button>

              <button
                (click)="agregarAFavoritos(p)"
                class="btn btn-outline-neon w-100">
                ❤️ Favoritos
              </button>

            </div>

          </div>

        </div>

      </div>

    }
    }

  </div>

</div>
