<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<section class="contacto-section py-5 bg-white">

    <div class="container">

        <div class="row align-items-center">

            <!-- IMAGEN -->
            <div class="col-md-6 d-flex justify-content-center position-relative mb-5 mb-md-0">

                <div class="profile-circle-container">

                    <div class="circle-border border-orange"></div>
                    <div class="circle-border border-blue"></div>
                    <div class="circle-border border-teal"></div>

                    <img src="https://c.tenor.com/yXz58A2g3DEAAAAC/tenor.gif"
                         alt="Animación de Contacto"
                         class="img-profile-gif">

                </div>

            </div>

            <!-- INFO CONTACTO -->
            <div class="col-md-6 ps-md-5">

                <h2 class="display-2 fw-bold text-dark mb-5">
                    Contacto
                </h2>

                <div class="d-flex align-items-center mb-4">

                    <div class="icon-box bg-blue me-3">
                        <i class="bi bi-house-door-fill text-white fs-3"></i>
                    </div>

                    <div>
                        <h5 class="fw-bold mb-0 text-primary-custom">Dirección:</h5>
                        <p class="text-muted mb-0">Cet 30 - Cipolletti</p>
                    </div>

                </div>

                <div class="d-flex align-items-center mb-4">

                    <div class="icon-box bg-light-blue me-3">
                        <i class="bi bi-telephone-fill text-white fs-3"></i>
                    </div>

                    <div>
                        <h5 class="fw-bold mb-0 text-info">Número de Contacto:</h5>
                        <p class="text-muted mb-0">0123456789</p>
                    </div>

                </div>

                <div class="d-flex align-items-center">

                    <div class="icon-box bg-teal me-3">
                        <i class="bi bi-at text-white fs-2"></i>
                    </div>

                    <div>
                        <h5 class="fw-bold mb-0 text-teal-custom">Correo Electrónico:</h5>
                        <p class="text-muted mb-0">jaratomas01022008@gmail.com</p>
                    </div>

                </div>

            </div>

        </div>

        <!-- MAPA -->
        <div class="row">

            <div class="col-12 mt-5">

                <iframe
                    class="mapa-contacto"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3103.74345285334!2d-67.9882264232437!3d-38.929840898646425!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x960a30ef2ee4b6b3%3A0xf60599626c221a60!2sCentro%20Educativo%20Tecnica%20N%C2%BA%2030!5e0!3m2!1ses-419!2sar!4v1782129483043!5m2!1ses-419!2sar"
                    width="100%"
                    height="350"
                    style="border:0;"
                    loading="lazy">
                </iframe>

            </div>

        </div>

        <!-- FORMULARIO -->
         <h2 class="display-4 fw-bold text-center mt-5 mb-4">
            Envíanos tu consulta
        </h2>
        <form (submit)="enviarConsulta($event)">

            <div class="row g-3 mt-5">

                <div class="col-md-6">
                    <input type="text"
                           class="form-control custom-input"
                           placeholder="Tu nombre">
                </div>

                <div class="col-md-6">
                    <input type="email"
                           class="form-control custom-input"
                           placeholder="Tu email">
                </div>

                <div class="col-12">
                    <input type="text"
                           class="form-control custom-input"
                           placeholder="Asunto">
                </div>

                <div class="col-12">
                    <textarea rows="4"
                              class="form-control custom-input"
                              placeholder="Escribe tu mensaje..."></textarea>
                </div>

                <div class="col-12 text-center">
                    <button type="submit" class="btn btn-send px-5">
                        Enviar consulta
                    </button>
                </div>

            </div>

        </form>

    </div>

</section>
